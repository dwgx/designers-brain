<!doctype html>
<html lang="zh">
<head><meta charset="utf-8"><title>PIXEL — 音轨合成（OfflineAudioContext）</title></head>
<body>
<script>
"use strict";
/* =============================================================================
   音轨：全部用 WebAudio OfflineAudioContext 代码合成（无采样、无录音）
   卡点：所有事件时间 = 帧号 / 30，与画面同一张时间表（10s = 441000 采样 @44.1k）
   ============================================================================= */
const FPS = 30, DUR = 10, SR = 44100, N = SR * DUR;
const F = f => f / FPS;                       // 帧号 -> 秒（音画同一时间源）

function mulberry32(a){ return function(){ a|=0; a=(a+0x6D2B79F5)|0;
  let t=Math.imul(a^(a>>>15), 1|a); t=(t+Math.imul(t^(t>>>7), 61|t))^t;
  return ((t^(t>>>14))>>>0)/4294967296; }; }

/* ---------- WAV 编码（16-bit PCM，立体声交织） ---------- */
function encodeWav(buf){
  const n = buf.length, ch = buf.numberOfChannels, sr = buf.sampleRate;
  const bytes = 44 + n*ch*2;
  const ab = new ArrayBuffer(bytes), dv = new DataView(ab);
  const w = (o,s) => { for (let i=0;i<s.length;i++) dv.setUint8(o+i, s.charCodeAt(i)); };
  w(0,'RIFF'); dv.setUint32(4, bytes-8, true); w(8,'WAVE'); w(12,'fmt ');
  dv.setUint32(16,16,true); dv.setUint16(20,1,true); dv.setUint16(22,ch,true);
  dv.setUint32(24,sr,true); dv.setUint32(28,sr*ch*2,true);
  dv.setUint16(32,ch*2,true); dv.setUint16(34,16,true);
  w(36,'data'); dv.setUint32(40, n*ch*2, true);
  const chans = []; for (let c=0;c<ch;c++) chans.push(buf.getChannelData(c));
  let o = 44;
  for (let i=0;i<n;i++) for (let c=0;c<ch;c++){
    const s = Math.max(-1, Math.min(1, chans[c][i]));
    dv.setInt16(o, s < 0 ? s*0x8000 : s*0x7FFF, true); o += 2;
  }
  return ab;
}
function b64(ab){
  const u8 = new Uint8Array(ab); let s = '';
  for (let i=0;i<u8.length;i+=0x8000) s += String.fromCharCode.apply(null, u8.subarray(i, i+0x8000));
  return btoa(s);
}

async function synthScore(){
  const off = new OfflineAudioContext(2, N, SR);
  const master = off.createGain(); master.gain.value = 1.0; master.connect(off.destination);

  /* 噪声源（播种，确定性） */
  const nlen = Math.floor(SR*0.6);
  const nbuf = off.createBuffer(1, nlen, SR);
  const nd = nbuf.getChannelData(0);
  const r = mulberry32(0xB0A7);
  for (let i=0;i<nlen;i++) nd[i] = r()*2 - 1;

  const env = (g,t0,a,d,peak) => {
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(Math.max(0.0002,peak), t0+a);
    g.gain.exponentialRampToValueAtTime(0.0001, t0+a+d);
  };
  function tone(t0, dur, f0, f1, type, peak, dest){
    const o = off.createOscillator(), g = off.createGain();
    o.type = type; o.frequency.setValueAtTime(f0, t0);
    if (f1 && f1 !== f0) o.frequency.exponentialRampToValueAtTime(Math.max(20, f1), t0+dur);
    env(g, t0, Math.min(0.012, dur*0.25), dur, peak);
    o.connect(g).connect(dest || master);
    o.start(t0); o.stop(t0+dur+0.05);
  }
  function noiseHit(t0, dur, f0, f1, peak, Q){
    const s = off.createBufferSource(); s.buffer = nbuf;
    const bp = off.createBiquadFilter(); bp.type = 'bandpass'; bp.Q.value = Q || 1.2;
    bp.frequency.setValueAtTime(f0, t0);
    if (f1) bp.frequency.exponentialRampToValueAtTime(Math.max(40,f1), t0+dur);
    const g = off.createGain(); env(g, t0, 0.006, dur, peak);
    s.connect(bp).connect(g).connect(master);
    s.start(t0); s.stop(t0+dur+0.05);
  }
  function coin(t0){                       // 金币：两个方波短音（经典音效）
    tone(t0,        0.045, 987.77, 987.77, 'square', 0.16);
    tone(t0 + 0.055,0.16, 1318.51, 1318.51, 'square', 0.14);
  }
  function bell(t0, f0, peak){
    tone(t0, 1.6, f0, f0, 'sine', peak);
    tone(t0, 1.2, f0*2.01, f0*2.01, 'sine', peak*0.45);
    tone(t0, 0.9, f0*3.02, f0*3.02, 'sine', peak*0.22);
  }

  /* ---------- 1. 配乐（120 BPM，2s/小节 × 5） ---------- */
  const A2=110, F2=87.31, C3=130.81, G2=98;
  const CH = [
    { root:A2,  tones:[220.00, 261.63, 329.63] },   // Am
    { root:F2,  tones:[174.61, 220.00, 261.63] },   // F
    { root:C3,  tones:[261.63, 329.63, 392.00] },   // C
    { root:G2,  tones:[196.00, 246.94, 293.66] },   // G
    { root:C3,  tones:[261.63, 329.63, 392.00] }    // C（收尾）
  ];
  const BAR = 2.0;
  for (let b=0; b<5; b++){
    const t0 = b*BAR, ch = CH[b];
    tone(t0,       0.9, ch.root, ch.root, 'triangle', 0.20);     // 低音 1
    tone(t0+1.0,   0.9, ch.root, ch.root, 'triangle', 0.16);     // 低音 3
    for (const f of ch.tones) tone(t0, 1.9, f, f, 'triangle', 0.035);  // 和弦垫
    for (let i=0;i<8;i++){                                        // 八分琶音
      const f = ch.tones[[0,1,2,1][i%4]] * (i%4===3 ? 2 : 1);
      tone(t0 + i*0.25, 0.18, f, f, 'square', 0.030);
    }
    for (let i=0;i<4;i++) noiseHit(t0 + i*0.5, 0.05, 6000, 4000, 0.020, 0.8);  // 沙锤
  }
  /* 旋律（第 3-5 小节，A 小调五声） */
  const MEL = [
    [4.0, 659.25, 0.5], [4.5, 587.33, 0.25], [4.75, 523.25, 0.25],
    [5.0, 587.33, 0.5], [5.5, 440.00, 0.5],
    [6.0, 659.25, 0.25], [6.25, 783.99, 0.5], [6.75, 659.25, 0.5],
    [7.0, 587.33, 0.5], [7.5, 523.25, 0.5],
    [8.0, 659.25, 0.5], [8.5, 880.00, 0.5],
    [9.0, 1046.50, 0.6], [9.6, 1318.51, 0.35]
  ];
  for (const [t0,f,d] of MEL) tone(t0, d, f, f, 'square', 0.055);

  /* ---------- 2. 音效（全部按帧号卡点） ---------- */
  noiseHit(F(45), 0.35, 900, 2600, 0.28, 0.9);          // 抛竿：挥杆风声
  tone(F(45), 0.22, 300, 900, 'triangle', 0.08);
  noiseHit(F(63), 0.14, 2600, 700, 0.22, 1.0);          // 入水：水花
  tone(F(63), 0.16, 700, 180, 'sine', 0.18);            // 咕咚
  tone(F(100), 0.06, 1800, 1200, 'square', 0.05);       // 竿尖轻点
  tone(F(144), 0.30, 180, 720, 'sawtooth', 0.07);       // 咬钩前的紧张上扬
  tone(F(150), 0.20, 520, 110, 'sine', 0.30);           // 浮漂一沉：闷响
  noiseHit(F(150), 0.10, 1400, 500, 0.24, 1.0);
  tone(F(156), 0.16, 320, 980, 'square', 0.09);         // 惊觉
  for (let f=166; f<196; f+=3){                          // 收线棘轮：10Hz，与姿态同拍
    noiseHit(F(f), 0.035, 3200, 2400, 0.085, 2.0);
  }
  noiseHit(F(196), 0.30, 3000, 800, 0.30, 1.0);         // 大鱼跃出：大水花
  tone(F(196), 0.26, 220, 760, 'sine', 0.20);           // 弹起
  noiseHit(F(212), 0.18, 2200, 700, 0.22, 1.0);         // 落水
  noiseHit(F(216), 0.40, 500, 2600, 0.16, 0.9);         // 起竿提鱼
  bell(F(240), 880.00, 0.16);                            // 提稳：钟声
  [250,256,262,268,274,280,286,292,298].forEach(f => coin(F(f)));  // 金币声 ×9
  tone(F(270), 0.30, 130, 60, 'sine', 0.34);            // 文案砸下：低频冲击
  noiseHit(F(270), 0.22, 1800, 300, 0.26, 1.0);
  bell(F(272), 1046.50, 0.20);                           // 收尾钟
  tone(F(276), 0.9, 523.25, 523.25, 'triangle', 0.06);
  tone(F(276), 0.9, 659.25, 659.25, 'triangle', 0.05);

  const buf = await off.startRendering();
  /* 软限幅：峰值压到 0.92（确定性缩放） */
  let peak = 0;
  for (let c=0;c<buf.numberOfChannels;c++){
    const d = buf.getChannelData(c);
    for (let i=0;i<d.length;i++){ const a = Math.abs(d[i]); if (a > peak) peak = a; }
  }
  const k = peak > 0.92 ? 0.92/peak : 1.0;
  if (k !== 1) for (let c=0;c<buf.numberOfChannels;c++){
    const d = buf.getChannelData(c);
    for (let i=0;i<d.length;i++) d[i] *= k;
  }
  return { b64: b64(encodeWav(buf)), peak: Number(peak.toFixed(4)), gain: Number(k.toFixed(4)),
           samples: buf.length, sampleRate: buf.sampleRate, channels: buf.numberOfChannels };
}
window.synthScore = synthScore;
</script>
</body>
</html>
